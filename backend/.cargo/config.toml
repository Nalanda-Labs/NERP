[env]
# samael (SAML) generates its xmlsec bindings at build time. Since xmlsec 1.3.13 the headers it
# includes no longer pull in xmlsec/dl.h, where xmlSecCryptoDLLoadLibrary is declared, so it is
# included explicitly. xmlsec/xmlsec.h goes first: with xmlsec 1.2 (Ubuntu's) dl.h does not include
# the header that defines XMLSEC_EXPORT itself.
BINDGEN_EXTRA_CLANG_ARGS = "-include xmlsec/xmlsec.h -include xmlsec/dl.h"
