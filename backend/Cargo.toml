[package]
name = "nerp-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nerp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
encoding_rs = "0.8.44"
qrcodegen = "1.8.0"
htmd = "0.5.6"
yrs = "0.28.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.10.3"
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
rust_xlsxwriter = { version = "0.102.0", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"
hmac = "0.13.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate", "rust_decimal"] }
thiserror = "2.0.21"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth", "qr"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
libc = "0.2"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
mail-parser = "1.0.1"
aes-gcm = "0.11.1"
ammonia = "4.2.4"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.11"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "limit", "compression-gzip", "compression-br", "compression-zstd"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-no-provider"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
quick-xml = "0.42.0"
