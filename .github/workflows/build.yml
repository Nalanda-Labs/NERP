# Build: compiles the backend and runs its unit tests, type-checks and builds the frontend,
# and type-checks the end-to-end suites. The backend's SQL is checked against the schema at
# compile time, so it migrates a PostgreSQL database first (nerp-migrate) and builds against it.
name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: nerp
          POSTGRES_PASSWORD: nerp-ci
          POSTGRES_DB: nerp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nerp" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://nerp:nerp-ci@127.0.0.1:5432/nerp
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # SAML sign-on verifies signatures with xmlsec (samael builds its bindings with clang).
      - name: Install xmlsec and libxml2
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libxmlsec1-dev libxml2-dev libclang-dev pkg-config
      - name: Migrate the build database
        run: cargo run --locked --bin nerp-migrate
      - run: cargo build --locked
      - run: cargo test --locked

  frontend:
    name: Frontend (check + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  tests-typecheck:
    name: E2E suites (type-check)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm run check
